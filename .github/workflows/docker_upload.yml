name: Upload to DockerHub

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Events-AI tests"]
    types:
      - completed

jobs:
  docker:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/pnikonowicz/events-ai:dev-${{ github.run_number }}

      - name: Save immutable image reference
        id: image
        env:
          IMAGE: docker.io/pnikonowicz/events-ai
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

  deploy-fetch-job:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy Cloud Run job
        env:
          PROJECT_ID: events-ai-456600
          IMAGE: ${{ needs.docker.outputs.image }}
        run: |
          gcloud run jobs deploy events-ai-fetch \
            --project "$PROJECT_ID" \
            --region us-central1 \
            --image "$IMAGE" \
            --wait \
            --quiet

  deploy-server-service:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy Cloud Run service
        env:
          PROJECT_ID: events-ai-456600
          IMAGE: ${{ needs.docker.outputs.image }}
        run: |
          gcloud run deploy events-ai-server \
            --project "$PROJECT_ID" \
            --region us-central1 \
            --image "$IMAGE" \
            --platform managed \
            --quiet
